name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The node the app carries: the Linux build, at the commit the shared app pins.
  node:
    runs-on: ubuntu-22.04
    container: swift:6.1-jammy
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: git config --global --add safe.directory '*'
      - run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev python3
      - run: scripts/build-node-binaries.sh
      - uses: actions/upload-artifact@v4
        with:
          name: node-linux-amd64
          path: build/linux/
          if-no-files-found: error

  # The app as it ships: the shared app packaged around those binaries, its
  # tests run on Windows, and the installed app launched with WSL, where it
  # has to bring its own node up.
  app:
    needs: node
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: node-linux-amd64
          path: build/linux
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the GPU worker
        shell: pwsh
        run: scripts\build-gpu-worker.ps1
      - name: Build the installer
        shell: pwsh
        run: scripts\build-app.ps1
      - name: The shared app's tests
        shell: pwsh
        working-directory: vendor/lattice-desktop
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:TAURI_CONFIG = Get-Content ..\..\tauri.windows.conf.json -Raw
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: libsqlite3-0
      - name: Install the app
        shell: pwsh
        run: |
          $version = (Get-Content vendor/lattice-desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "dist\Lattice_${version}_x64-setup.exe"
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          Get-ChildItem "$env:LOCALAPPDATA\Lattice"
          $info = (Get-Item "$env:LOCALAPPDATA\Lattice\lattice-desktop.exe").VersionInfo
          $installedVersion = "$($info.ProductMajorPart).$($info.ProductMinorPart).$($info.ProductBuildPart)"
          if ($installedVersion -ne $version -or $info.ProductPrivatePart -ne 0) { throw "installed app version does not match release configuration" }
          $notices = Join-Path $env:LOCALAPPDATA "Lattice\THIRD-PARTY-NOTICES.txt"
          if (-not (Test-Path $notices) -or (Get-Item $notices).Length -eq 0) { throw "installed notices missing" }
      - name: The installed app starts its node in WSL, and its mining loop there runs the Windows worker
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Lattice\*.exe" | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          $env:LATTICE_APP = $exe.FullName
          $env:LATTICE_LINUX_BIN = "build\linux"
          node --test test/installed-app.test.mjs
      - name: WebDriver for the app's window
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The msedgedriver that matches this machine's WebView2 runtime.
          cargo install --git https://github.com/chippers/msedgedriver-tool
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force build\webdriver | Out-Null
          Push-Location build\webdriver
          msedgedriver-tool.exe
          Pop-Location
          Get-ChildItem build\webdriver
      # The installer is already in dist\; this rebuilds the executable alone,
      # with the debugging port WebDriver attaches to, and puts it beside the
      # installed one, where its resources are.
      - name: The app's executable, built for WebDriver
        shell: pwsh
        run: |
          scripts\build-webdriver-app.ps1
          Copy-Item build\webdriver\lattice-desktop-webdriver.exe "$env:LOCALAPPDATA\Lattice\"
      - name: The installed app in its own window, driven through WebDriver
        shell: pwsh
        run: scripts\test-ui.ps1 -App "$env:LOCALAPPDATA\Lattice\lattice-desktop-webdriver.exe" -NativeDriver build\webdriver\msedgedriver.exe
      - name: Native release navigation and lock keyboard checks
        shell: pwsh
        run: scripts\test-ui.ps1 -App "$env:LOCALAPPDATA\Lattice\lattice-desktop-webdriver.exe" -NativeDriver build\webdriver\msedgedriver.exe -Test test\release-ui.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lattice-desktop-windows-x64
          path: dist/
          if-no-files-found: error
